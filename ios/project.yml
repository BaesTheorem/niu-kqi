name: KQiRides
options:
  bundleIdPrefix: com.alexhedtke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  KQiRides:
    type: application
    platform: iOS
    sources:
      - path: KQiRides/Sources
      - path: KQiRides/Resources
      - path: Shared
    dependencies:
      - target: KQiRidesWidget
    # The App Group is how the Lock Screen widget reads the last power state and
    # battery level that the app wrote.
    entitlements:
      path: KQiRides/KQiRides.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alexhedtke.KQiRides
    info:
      path: KQiRides/Info.plist
      properties:
        CFBundleDisplayName: KQi Air
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # kqirides://unlock , kqirides://lock , kqirides://on , kqirides://off .
        # An NFC-triggered Shortcut opens one of these, or runs the matching App
        # Intent directly; both land in AppState.performExternal via its allowlist.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.alexhedtke.KQiRides
            CFBundleURLSchemes:
              - kqirides
        UIAppFonts:
          - MaterialSymbolsSharp.ttf
        # CoreBluetooth crashes on first use without this key, rather than
        # failing gracefully, so it is not optional.
        NSBluetoothAlwaysUsageDescription: KQi Rides talks to your scooter over Bluetooth to read status and change settings.
        NSBluetoothPeripheralUsageDescription: KQi Rides talks to your scooter over Bluetooth to read status and change settings.
        # The widget's power button runs in this app's process, launched in the
        # background. Without bluetooth-central, CoreBluetooth holds every event
        # until the app comes to the foreground, so the tap would do nothing.
        UIBackgroundModes:
          - bluetooth-central
        # The power intent conforms to LiveActivityIntent, which is what moves
        # it from the widget process into the app. The app starts no Live
        # Activity. Apple does not say this key is required for that; it is
        # set because the protocol belongs to the Live Activities capability.
        NSSupportsLiveActivities: true

  # Lock Screen widget (circular and rectangular) and an iOS 18 control, both a
  # single button that runs PowerOnScooterIntent. The extension draws state; it
  # never talks to the scooter.
  KQiRidesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/KQiRidesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alexhedtke.KQiRides
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: KQi Air
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhedtke.KQiRides.Widget
        # Shared/PowerOnIntent.swift compiles in both targets; this flag keeps
        # the Bluetooth code out of the extension.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
